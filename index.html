<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <title>&gt; VantuzFed</title>
    <style>
      /* Critical, inline boot-screen styles — must render before any bundled
         CSS/JS has loaded, since the whole point is to cover that wait. */
      html, body { margin: 0; padding: 0; background: #000; }
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #000;
        transition: opacity 0.5s ease;
      }
      #boot-screen.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .boot-flag {
        display: grid;
        grid-template-columns: repeat(2, 20px);
        grid-template-rows: repeat(2, 20px);
        gap: 3px;
        animation: boot-flag-wave 1.8s ease-in-out infinite;
      }
      .boot-flag span {
        display: block;
        border-radius: 2px;
      }
      .boot-flag span:nth-child(1) { background: #ff4b3e; }
      .boot-flag span:nth-child(2) { background: #6dc24b; }
      .boot-flag span:nth-child(3) { background: #2f8be6; }
      .boot-flag span:nth-child(4) { background: #ffc72c; }
      @keyframes boot-flag-wave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .boot-title {
        font-family: Tahoma, "Segoe UI", Arial, sans-serif;
        font-size: 26px;
        font-style: italic;
        font-weight: 700;
        color: #fff;
        letter-spacing: 0.5px;
      }
      .boot-title em {
        font-style: italic;
        color: #6dc2ff;
        margin-left: 6px;
      }
      .boot-progress {
        width: 160px;
        height: 12px;
        border: 1px solid #2c2c2c;
        border-radius: 2px;
        background: #0a0a0a;
        overflow: hidden;
        position: relative;
      }
      .boot-progress__bar {
        position: absolute;
        top: 1px;
        bottom: 1px;
        width: 40px;
        background: linear-gradient(180deg, #5fb0ff, #2f7fdb);
        border-radius: 1px;
        animation: boot-progress-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-progress-slide {
        0% { left: -45px; }
        100% { left: 165px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-flag, .boot-progress__bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" aria-hidden="true">
      <div class="boot-logo">
        <div class="boot-flag"><span></span><span></span><span></span><span></span></div>
        <div class="boot-title">VantuzFed<em>XP</em></div>
      </div>
      <div class="boot-progress"><div class="boot-progress__bar"></div></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
